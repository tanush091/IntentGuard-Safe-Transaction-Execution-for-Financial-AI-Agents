# Security headers for the dashboard (docs/SECURITY.md 3.4, 8). Included in every location block
# because an add_header inside a location replaces the server-level ones.
#
# CSP: scripts, fonts (self-hosted via @fontsource) and API calls are same-origin only; no inline
# scripts. style-src keeps 'unsafe-inline' because Recharts and React set inline style attributes.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# HSTS only has an effect over HTTPS; set it at the TLS-terminating proxy in a real deployment:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
