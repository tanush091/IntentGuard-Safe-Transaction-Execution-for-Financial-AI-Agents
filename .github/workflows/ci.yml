name: CI

# Quality gates (docs/TEST_PLAN.md): lint, backend tests on SQLite and PostgreSQL, OpenAPI drift,
# dashboard unit tests and API contract, a quick benchmark that fails on any safety violation of the
# full protocol, secret scanning, dependency audits, and the Docker images.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.16.10
      - run: ruff check .

  backend:
    name: Backend tests (SQLite) + OpenAPI drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Tests
        working-directory: backend
        run: python -m pytest -q
      - name: docs/api/openapi.json matches the code
        run: python scripts/export_openapi.py --check

  backend-postgres:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: intentguard
          POSTGRES_PASSWORD: intentguard_ci
          POSTGRES_DB: intentguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U intentguard -d intentguard_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Every test runs against this database (reset per test); see backend/tests/conftest.py.
      TEST_DATABASE_URL: postgresql+psycopg://intentguard:intentguard_ci@localhost:5432/intentguard_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Dashboard tests, contract, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Every dashboard route exists in the gateway's OpenAPI schema
        run: npm run check:contract
      - run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high

  benchmark:
    name: Quick benchmark (safety gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: 15 arms x 2 seeds x 60 scenarios
        working-directory: experiments
        run: python -m bench run --seeds 2 --scenarios 60 --workers 2 --out ../.bench-ci
      - name: Full protocol has no duplicate effect, undetected wrong money or misreport
        run: python scripts/check_bench_safety.py .bench-ci/latest/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-quick
          path: .bench-ci/latest/
          if-no-files-found: ignore

  security:
    name: Secret scan + Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          python -m pip install pip-audit
          pip-audit -r backend/requirements.txt

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
