services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: intentguard
      POSTGRES_PASSWORD: intentguard_secret
      POSTGRES_DB: intentguard_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intentguard -d intentguard_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  provider:
    build:
      context: ./backend
    command: ["uvicorn", "provider_api.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      PAYSIM_STATE_PATH: /data/paysim_state.json
      PAYSIM_SETTLE_DELAY_S: "3"
      SIMULATOR_MODE: "true"
      # Signed status-change events to the gateway; the secret comes from .env (scripts/init_env.py).
      PAYSIM_WEBHOOK_URL: http://gateway:8000/api/webhooks/paysim
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
    volumes:
      - paysim:/data
    ports:
      - "8001:8001"

  gateway:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://intentguard:intentguard_secret@postgres:5432/intentguard_db
      PAYMENT_PROVIDER: http
      PAYMENT_SERVICE_URL: http://provider:8001
      CORS_ORIGINS: http://localhost:3000
      RESULTS_DIR: /app/experiments/results
      SIMULATOR_MODE: "true"
      JWT_SECRET: ${JWT_SECRET:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
    volumes:
      # Benchmark results shown on the dashboard's Experiments page (read-only).
      - ./experiments/results:/app/experiments/results:ro
    depends_on:
      postgres:
        condition: service_healthy
      provider:
        condition: service_started
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - gateway
    ports:
      - "3000:80"

volumes:
  pgdata:
  paysim:
