version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: intentguard_db
    restart: always
    environment:
      POSTGRES_USER: intentguard
      POSTGRES_PASSWORD: intentguard_secret
      POSTGRES_DB: intentguard_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intentguard -d intentguard_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mock-payment-service:
    build:
      context: .
      dockerfile: ./mock-payment-service/Dockerfile
    container_name: intentguard_mock_payment
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - HOST=0.0.0.0
    restart: on-failure

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: intentguard_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://intentguard:intentguard_secret@postgres:5432/intentguard_db
      - PAYMENT_SERVICE_URL=http://mock-payment-service:8001
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy
      mock-payment-service:
        condition: service_started
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: intentguard_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: on-failure

volumes:
  pgdata:
