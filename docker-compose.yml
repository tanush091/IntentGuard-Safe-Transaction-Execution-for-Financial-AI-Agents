services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: intentguard
      POSTGRES_PASSWORD: intentguard_secret
      POSTGRES_DB: intentguard_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intentguard -d intentguard_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  provider:
    build:
      context: .
      dockerfile: deploy/provider.Dockerfile
    environment:
      PAYSIM_STATE_PATH: /data/paysim_state.json
      PAYSIM_SETTLE_DELAY_S: "3"
    volumes:
      - paysim:/data
    ports:
      - "8001:8001"

  gateway:
    build:
      context: .
      dockerfile: deploy/gateway.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://intentguard:intentguard_secret@postgres:5432/intentguard_db
      PAYMENT_PROVIDER: http
      PAYMENT_SERVICE_URL: http://provider:8001
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      provider:
        condition: service_started
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - gateway
    ports:
      - "3000:80"

volumes:
  pgdata:
  paysim:
